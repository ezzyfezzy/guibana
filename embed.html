<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Guibana player (embed)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/styles.css">
<style>
  /* embed-only layout: just the player, none of the full app's chord-input/arrangement-editor chrome */
  .wrap{padding-block:16px 24px}
</style>
</head>
<body>
<div class="wrap">

  <section>
    <div class="boardbar">
      <div class="chips" id="chips" role="group" aria-label="Chord playing now"></div>
      <div class="ctrls">
        <label class="tempo"><span>Speed</span><input type="range" id="tempo" min="50" max="180" step="2"><output id="tempoOut"></output></label>
        <button class="play" id="play" type="button"></button>
      </div>
      <div class="pos" id="pos" hidden></div>
    </div>
    <div class="secwrap" id="secWrap" hidden>
      <div class="seccard" id="secCard" aria-live="polite">
        <span class="secbar" aria-hidden="true"></span>
        <div class="secnow"><b id="secName"></b><span id="secMeta"></span></div>
        <div class="secnext" id="secNext"></div>
      </div>
      <div class="timeline" id="timeline" role="group" aria-label="Song sections. Choose one to play from there."></div>
    </div>
    <div class="boardbar">
      <div class="ctrls">
        <div class="seg" role="group" aria-label="How much of the neck">
          <button id="vBox" type="button">Easy box</button>
          <button id="vNeck" type="button">Whole neck</button>
        </div>
        <div class="seg" role="group" aria-label="Dot labels">
          <button id="lbNotes" type="button">Note names</button>
          <button id="lbDeg" type="button">Intervals</button>
        </div>
      </div>
      <div class="ctrls">
        <span class="tonelab" id="toneLab">Guitar tone</span><span class="snd" id="snd" aria-live="polite"></span>
        <div class="seg tone" id="toneSel" role="group" aria-labelledby="toneLab"></div>
      </div>
    </div>
    <div class="boardscroll" id="boardScroll"><svg id="board" role="img" aria-label="Guitar fretboard in standard tuning"></svg></div>
    <p class="scrollhint">Swipe the fretboard sideways to see the whole neck.</p>
  </section>

  <div hidden aria-hidden="true">
    <!-- stub elements that the shared board/audio/readout/embed modules wire up unconditionally,
         but that this embed's stripped-down layout has no visible place for -->
    <div id="tiles"></div><p id="sum"></p><p id="homeline"></p><span id="nowName"></span><p id="nowTxt"></p><span id="nextTxt"></span>
    <div id="notesDd"><button id="notesToggle" type="button"></button><div id="notesPanel" hidden></div></div>
    <input type="range" id="mixGtr"><input type="range" id="mixBass"><input type="range" id="mixDrums">
    <div id="arr"></div>
    <textarea id="embedJson"></textarea>
    <button id="embedLoad" type="button"></button>
    <p id="embedMsg"></p>
  </div>

</div>

<script>window.GUIBANA_STORAGE_KEY='guibana-embed-v1';</script>
<script type="module" src="js/embed.js"></script>

<script>
/* ---------- tell a host page how tall the player actually is, so it can size
   its iframe to fit instead of guessing a fixed height (varies a lot by width:
   the controls wrap onto more lines on narrow screens) ---------- */
(() => {
  if (window.parent === window) {
    return;
  }

  const report = () => window.parent.postMessage({ type: 'guibana-embed-height', height: document.documentElement.scrollHeight }, '*');

  new ResizeObserver(report).observe(document.documentElement);
  window.addEventListener('load', report);
})();
</script>

</body>
</html>
